plugins { id 'com.android.application' }
android {
    namespace 'com.colonellp.ellamonitor'
    compileSdk { version = release(37) }
    defaultConfig {
        applicationId 'com.colonellp.ellamonitor.preview'
        minSdk 27
        targetSdk 37
        versionCode 7
        versionName '0.25'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { unitTests.includeAndroidResources = true; unitTests.all { if (project.hasProperty("renderPath")) systemProperty "ella.render.path", project.property("renderPath") } }
    lint { abortOnError true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16'
}


// AGP 9.4 public Variant API: Android Studio and CLI produce the same filename.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(output.versionName.map { version -> "Ella-monitoring-v${version}.apk" })
        }
    }
}
